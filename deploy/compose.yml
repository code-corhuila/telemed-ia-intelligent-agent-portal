name: telemed-ia-intelligent-agent-portal

services:
  intelligent-agent-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The shell loads this remote in the browser from http://localhost:4202/remoteEntry.json
    # (telemed-ia-front federation.manifest.json), like identity (4206) and notifications (4208).
    ports:
      - "${PORT:-4202}:80"
    networks:
      - platform

networks:
  platform:
    name: platform
    external: true